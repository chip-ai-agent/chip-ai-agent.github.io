<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Logo A 芯片智能体</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 560px; height: 560px; box-sizing: border-box; background: #F5F6F8; display: flex; align-items: center; justify-content: center">
<svg width="260" height="260" viewBox="0 0 240 240" role="img" aria-label="Logo 方案 A：带引脚的芯片，里面是一双智能体的眼睛">
<g stroke="#0E1116" stroke-width="12" stroke-linecap="round" fill="none">
<rect x="56" y="56" width="128" height="128" rx="26" stroke-width="14"></rect>
<line x1="94" y1="56" x2="94" y2="26"></line>
<line x1="146" y1="56" x2="146" y2="26"></line>
<line x1="94" y1="184" x2="94" y2="214"></line>
<line x1="146" y1="184" x2="146" y2="214"></line>
<line x1="56" y1="94" x2="26" y2="94"></line>
<line x1="56" y1="146" x2="26" y2="146"></line>
<line x1="184" y1="94" x2="214" y2="94"></line>
<line x1="184" y1="146" x2="214" y2="146"></line>
</g>
<rect x="92" y="98" width="18" height="44" rx="9" fill="{{accent}}"></rect>
<rect x="130" y="98" width="18" height="44" rx="9" fill="{{accent}}"></rect>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BFF","options":["#2F5BFF","#00A37A","#FF6A2B","#7A3CFF"]},"$preview":{"width":560,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2F5BFF' };
}
}
</script>
</body>
</html>
